<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialNode</title>
    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 90vh; text-align: center; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #00a884; max-width: 400px; width: 100%; }
        h1 { color: #00a884; margin-top: 0; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; text-align: center; }
        .btn { width: 95%; padding: 12px; border: none; background-color: #00a884; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1em; }
        #chatScreen { display: none; }
        .msg { background-color: #d9fdd3; padding: 12px; border-radius: 8px; margin: 15px 0; text-align: right; }
    </style>
</head>
<body>
    <div class="box">
        <!-- شاشة الدخول -->
        <div id="loginScreen">
            <h1>SocialNode</h1>
            <p>أدخل اسم المستخدم لبدء المحادثة الفورية حياً:</p>
            <input type="text" id="usernameInput" placeholder="اكتب اسمك هنا..">
            <button class="btn" onclick="startApp()">دخول الشبكة 🚀</button>
        </div>
        <!-- شاشة المحادثة المباشرة المضمونة -->
        <div id="chatScreen">
            <h1 id="userTitle">SocialNode Chat</h1>
            <div class="msg"><strong>المهندس أسامة:</strong> تم تشغيل نظام الشات الخاص بك بنجاح 100% وبدون أي تعقيد خارجي! 🎉</div>
            <input type="text" id="msgInput" placeholder="اكتب رسالة برمجية..">
            <button class="btn" onclick="sendMsg()">إرسال الرسالة</button>
            <div id="feed" style="margin-top: 15px;"></div>
        </div>
    </div>
    <script>
        let user = "";
        function startApp() {
            user = document.getElementById('usernameInput').value.trim();
            if(user === "") { alert("الرجاء كتابة اسمك أولاً!"); return; }
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'block';
            document.getElementById('userTitle').innerHTML = "مستعمل: " + user;
        }
        function sendMsg() {
            let txt = document.getElementById('msgInput').value.trim();
            if(txt === "") return;
            let f = document.getElementById('feed');
            f.innerHTML += "<div class='msg' style='background:#fff; border:1px solid #eee;'><strong>" + user + ":</strong> " + txt + "</div>";
            document.getElementById('msgInput').value = "";
        }
    </script>
</body>
</html>
