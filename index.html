<!DOCTYPE html>
<html>
<head>
    <title>Osamah Secure Login</title>
    <style>
        body { background-color: #0c0c0c; color: #00ff00; font-family: monospace; text-align: center; padding-top: 50px; }
        h1 { font-size: 2.2em; text-shadow: 0 0 15px #00ff00; margin-bottom: 20px; }
        .login-box { border: 2px solid #00ff00; padding: 40px 30px; display: inline-block; border-radius: 10px; box-shadow: 0 0 25px rgba(0,255,0,0.4); background-color: #111; width: 300px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #00ff00; font-size: 1.1em; }
        input[type="email"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #00ff00; background-color: #000; color: #fff; border-radius: 5px; box-sizing: border-box; font-family: monospace; }
        input:focus { outline: none; box-shadow: 0 0 8px #00ff00; }
        .btn { width: 100%; padding: 12px; border: none; background-color: #00ff00; color: #000; font-weight: bold; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-family: monospace; box-shadow: 0 0 10px #00ff00; }
        .btn:hover { background-color: #00cc00; box-shadow: 0 0 15px #00cc00; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Osamah Secure Portal</h1>
        <form onsubmit="alert('تم إرسال البيانات بنجاح في المختبر!'); return false;">
            <div class="input-group">
                <label>Email Address:</label>
                <input type="email" placeholder="enter your email" required>
            </div>
            <div class="input-group">
                <label>Password:</label>
                <input type="password" placeholder="enter your password" required>
            </div>
            <button type="submit" class="btn">LOGIN</button>
        </form>
    </div>
</body>
</html>
