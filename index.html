<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Lite</title>
    <!-- تحميل مكتبة المحادثات الحية الفورية عبر الإنترنت -->
    <script src="https://pubnub.com"></script>
    <style>
        body { background-color: #dadbd3; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 450px; height: 100vh; display: flex; flex-direction: column; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); position: relative; }
        
        /* 1️⃣ تصميم شاشة الدخول المريحة */
        .login-box { padding: 30px; text-align: center; margin: auto; width: 80%; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .login-box h1 { color: #075e54; font-size: 1.8em; margin-top: 0; }
        .input-group { margin-bottom: 15px; text-align: right; direction: rtl; }
        label { display: block; margin-bottom: 5px; color: #555; font-size: 0.95em; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; background-color: #fff; color: #000; border-radius: 8px; box-sizing: border-box; font-size: 1em; }
        input:focus { outline: none; border-color: #25d366; }
        .btn { width: 100%; padding: 12px; border: none; background-color: #25d366; color: white; font-weight: bold; font-size: 1.1em; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn:hover { background-color: #20ba5a; }
        .error-msg { color: #ff3333; font-size: 0.85em; margin-top: 5px; display: none; text-align: right; }

        /* 2️⃣ شاشة قائمة جهات الاتصال والبحث */
        #lobbyScreen { display: none; width: 100%; height: 100%; flex-direction: column; background-color: #f0f2f5; }
        .lobby-header { background-color: #075e54; color: white; padding: 15px; text-align: right; direction: rtl; font-size: 1.2em; font-weight: bold; }
        .search-area { padding: 15px; background-color: #fff; border-bottom: 1px solid #e9edef; text-align: right; direction: rtl; }
        
        /* 3️⃣ واجهة شاشة المحادثة الحقيقية */
        #chatScreen { display: none; width: 100%; height: 100%; flex-direction: column; background-color: #efeae2; }
        .chat-header { background-color: #075e54; color: white; padding: 10px 15px; text-align: right; direction: rtl; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { margin: 0; font-size: 1.15em; }
        .back-btn { width: auto; padding: 6px 12px; font-size: 0.9em; background-color: #ff3333; margin: 0; }
        
        /* منطقة الرسائل الفورية بنمط الواتساب */
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; background-image: url('https://githubusercontent.com'); background-repeat: repeat; }
        .msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 8px; max-width: 75%; word-wrap: break-word; text-align: right; direction: rtl; font-size: 0.95em; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .msg.me { background-color: #d9fdd3; color: #111b21; align-self: flex-end; }
        .msg.other { background-color: #ffffff; color: #111b21; align-self: flex-start; }
        
        /* شريط الإرسال السفلي */
        .chat-input-area { padding: 10px; background-color: #f0f2f5; display: flex; gap: 8px; align-items: center; }
        .chat-input-area input { flex: 1; border-radius: 20px; padding: 10px 15px; border: none; }
        .send-btn { width: auto; padding: 10px 20px; border-radius: 20px; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 🔐 1. شاشة الدخول والتسجيل -->
        <div id="loginScreen" class="login-box">
            <h1>WhatsApp Lite</h1>
            <form onsubmit="handleRegistration(event)">
                <div class="input-group">
                    <label>البريد الإلكتروني:</label>
                    <input type="email" required placeholder="اكتب إيميلك هنا">
                </div>
                <div class="input-group">
                    <label>كلمة المرور:</label>
                    <input type="password" required placeholder="اكتب كلمة المرور">
                </div>
                <div class="input-group">
                    <label>اسم المستخدم (Username):</label>
                    <input type="text" id="usernameInput" required placeholder="اكتب اسم مستخدم فريد لك" autocomplete="off">
                    <div id="usernameError" class="error-msg">⚠️ هذا الاسم مستخدم حالياً، اختر اسماً آخر!</div>
                </div>
                <button type="submit" class="btn">دخول</button>
            </form>
        </div>

        <!-- 🔍 2. شاشة البحث عن اسم المستخدم لبدء شات -->
        <div id="lobbyScreen">
            <div class="lobby-header">محادثة جديدة</div>
            <div class="search-area">
                <label style="font-weight: bold; display: block; margin-bottom: 8px;">ابدأ محادثة مع صديق:</label>
                <input type="text" id="targetInput" placeholder="اكتب اسم مستخدم صديقك بدقة..">
                <button class="btn" style="margin-top: 15px;" onclick="startPrivateChat()">💬 بدء المحادثة</button>
            </div>
        </div>

        <!-- 💬 3. واجهة شاشة المحادثة (الواتساب) -->
        <div id="chatScreen">
            <div class="chat-header">
                <button class="btn back-btn" onclick="backToLobby()">خروج</button>
                <div>
                    <h2 id="chatWithTitle">اسم صديقك</h2>
                </div>
            </div>
            
            <div class="chat-messages" id="messageBox">
                <!-- الرسائل الفورية تظهر هنا حياً -->
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="اكتب رسالة..." autocomplete="off">
                <button class="btn send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>
    <script>
        let myUsername = "";
        let targetUser = "";
        let pubnub;
        let activeChannel = "";

        function handleRegistration(event) {
            event.preventDefault();
            myUsername = document.getElementById('usernameInput').value.trim().toLowerCase();
            
            // تهيئة الاتصال الفوري بالسيرفر الوسيط
            pubnub = new PubNub({
                publishKey: "pub-c-80bf85fe-9cb4-45aa-a6eb-ba5441e3a650",
                subscribeKey: "sub-c-572e9d2a-4364-4bf8-b996-51e44f849cf2",
                uuid: myUsername
            });

            // فحص منع تكرار الأسماء بين المستخدمين النشطين
            pubnub.hereNow({ channels: ["whatsapp_lite_check"], includeUUIDs: true }, function(status, response) {
                let occupants = response.channels["whatsapp_lite_check"]?.occupants || [];
                let nameExists = occupants.some(user => user.uuid === myUsername);

                if (nameExists) {
                    document.getElementById('usernameError').style.display = 'block';
                } else {
                    document.getElementById('usernameError').style.display = 'none';
                    // الدخول الناجح وفتح شاشة البحث
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('lobbyScreen').style.display = 'flex';
                    
                    // حفظ الاسم في الشبكة لمنع تكراره
                    pubnub.subscribe({ channels: ["whatsapp_lite_check"] });
                    listenForMessages();
                }
            });
        }

        function startPrivateChat() {
            targetUser = document.getElementById('targetInput').value.trim().toLowerCase();
            if (targetUser === "" || targetUser === myUsername) {
                alert("الرجاء كتابة اسم مستخدم صحيح لصديقك!");
                return;
            }

            document.getElementById('chatWithTitle').innerHTML = targetUser;
            
            // إنشاء قناة محادثة خاصة وسرية تجمع الاسمين معاً تلقائياً
            let sortedUsers = [myUsername, targetUser].sort();
            activeChannel = `whatsapp_room_${sortedUsers[0]}_and_${sortedUsers[1]}`;

            // الاشتراك في شات الصديق
            pubnub.subscribe({ channels: [activeChannel] });

            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';
            document.getElementById('messageBox').innerHTML = ""; // تصفية الرسائل القديمة
        }

        function listenForMessages() {
            pubnub.addListener({
                message: function(event) {
                    // التحقق من أن الرسالة تخص المحادثة الحالية ونفس القناة
                    if (event.channel === activeChannel) {
                        displayMessage(event.message.user, event.message.text);
                    }
                }
            });
        }

        function sendMessage() {
            let input = document.getElementById('msgInput');
            let text = input.value.trim();
            if (text === "") return;

            pubnub.publish({
                channel: activeChannel,
                message: { user: myUsername, text: text }
            });
            input.value = "";
        }

        function displayMessage(user, text) {
            let box = document.getElementById('messageBox');
            let isMe = (user === myUsername);
            let msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isMe ? 'me' : 'other'}`;
            msgDiv.innerHTML = text;
            
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight; // النزول التلقائي لآخر رسالة
        }

        function backToLobby() {
            pubnub.unsubscribe({ channels: [activeChannel] });
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById('lobbyScreen').style.display = 'flex';
        }

        document.getElementById('msgInput')?.addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
