<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osamah Secure Portal & Lab</title>
    <style>
        body { background-color: #0c0c0c; color: #00ff00; font-family: monospace; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 2.2em; text-shadow: 0 0 15px #00ff00; }
        
        /* تصميم صندوق تسجيل الدخول */
        .login-box { border: 2px solid #00ff00; padding: 40px 30px; display: inline-block; border-radius: 10px; box-shadow: 0 0 25px rgba(0,255,0,0.4); background-color: #111; width: 300px; margin-top: 50px; }
        .input-group { margin-bottom: 20px; text-align: right; direction: rtl; }
        label { display: block; margin-bottom: 5px; color: #00ff00; font-size: 1.1em; }
        input[type="email"], input[type="password"], input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #00ff00; background-color: #000; color: #fff; border-radius: 5px; box-sizing: border-box; font-family: monospace; }
        input:focus, textarea:focus { outline: none; box-shadow: 0 0 8px #00ff00; }
        .btn { width: 100%; padding: 12px; border: none; background-color: #00ff00; color: #000; font-weight: bold; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-family: monospace; box-shadow: 0 0 10px #00ff00; }
        .btn:hover { background-color: #00cc00; }

        /* تصميم صناديق المختبر (مخفية في البداية) */
        #cyberLab { display: none; }
        .section-box { border: 2px solid #00ff00; padding: 20px; margin-bottom: 25px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,255,0,0.2); background-color: #111; text-align: right; direction: rtl; }
        h2 { color: #fff; font-size: 1.4em; border-bottom: 1px solid #00ff00; padding-bottom: 5px; margin-top: 0; }
        .result-item, .post-item { background-color: #000; padding: 12px; border-right: 4px solid #00ff00; margin-top: 10px; border-radius: 3px; color: #fff; }
        .post-time { font-size: 0.8em; color: #00ff00; display: block; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">

        <!-- 1️⃣ الشاشة الأولى: صندوق تسجيل الدخول -->
        <div id="loginScreen">
            <div class="login-box">
                <h1 style="font-size: 1.8em;">Osamah Portal</h1>
                <!-- عند الضغط على الزر، سيتم تشغيل وظيفة الدخول البرمجية -->
                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label>البريد الإلكتروني:</label>
                        <input type="email" id="userEmail" placeholder="enter your email" required>
                    </div>
                    <div class="input-group">
                        <label>كلمة المرور:</label>
                        <input type="password" placeholder="enter your password" required>
                    </div>
                    <button type="submit" class="btn">LOGIN</button>
                </form>
            </div>
        </div>

        <!-- 2️⃣ الشاشة الثانية: المختبر الحي (يظهر بعد تسجيل الدخول بنجاح) -->
        <div id="cyberLab">
            <h1>Osamah Cyber Security Lab 🚀</h1>
            <p style="color: #fff;" id="welcomeMessage">مرحباً بك في موقعك الحي</p>

            <!-- محرك البحث -->
            <div class="section-box">
                <h2>🔍 البحث عن معلومات ونصائح أمنية</h2>
                <input type="text" id="searchInput" onkeyup="searchInfo()" placeholder="اكتب للبحث... (جرّب: كلمة سر، واي فاي)">
                <div id="searchResponse"></div>
            </div>

            <!-- لوحة التواصل الاجتماعي المصغرة -->
            <div class="section-box">
                <h2>💬 انشر تحديثاً حياً في المعمل</h2>
                <textarea id="postText" rows="3" placeholder="ماذا تتعلم اليوم؟ اكتب هنا..."></textarea>
                <button class="btn" style="width: auto;" onclick="addPost()">نـشـر التحديث</button>
                <div id="liveFeed">
                    <div class="post-item">
                        <strong>المهندس أسامة:</strong> تم تسجيل الدخول وفتح المختبر بنجاح!
                        <span class="post-time">منذ قليل</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- كود الربط والتحكم الذكي (JavaScript) -->
    <script>
        // وظيفة معالجة تسجيل الدخول والتحويل
        function handleLogin(event) {
            event.preventDefault(); // منع الصفحة من إعادة التحميل الافتراضية
            
            let email = document.getElementById('userEmail').value;
            
            // 🚀 السحر البرمجي هنا: إخفاء صفحة الدخول وإظهار المختبر
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('cyberLab').style.display = 'block';
            
            // تخصيص رسالة الترحيب باسم إيميل المستخدم الذي كتبه
            document.getElementById('welcomeMessage').innerHTML = `🔓 تم الدخول بنجاح بحساب: <span style="color:#fff;">${email}</span>`;
        }

        // قاعدة بيانات محرك البحث
        const database = [
            { key: "كلمة سر", val: "💡 نصيحة أمنية: لتأمين حسابك، اجعل كلمة السر لا تقل عن 12 خانة وتحتوي على رموز وأرقام." },
            { key: "واي فاي", val: "🛡️ حماية الشبكات: قم بإخفاء اسم شبكة الواي فاي المنزلية وعطل خاصية WPS لحمايتها." }
        ];

        function searchInfo() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let responseDiv = document.getElementById('searchResponse');
            responseDiv.innerHTML = "";
            if (input.trim() === "") return;
            let found = database.filter(item => item.key.includes(input));
            if (found.length > 0) {
                found.forEach(item => { responseDiv.innerHTML += `<div class="result-item">${item.val}</div>`; });
            } else {
                responseDiv.innerHTML = `<div class="result-item" style="color:red;">❌ لا توجد معلومات حالياً.</div>`;
            }
        }

        function addPost() {
            let postTextArea = document.getElementById('postText');
            let postContent = postTextArea.value.trim();
            if (postContent === "") return;
            let feed = document.getElementById('liveFeed');
            let newPost = document.createElement('div');
            newPost.className = 'post-item';
            newPost.innerHTML = `<strong>عضو في المختبر:</strong> ${postContent}<span class="post-time">الآن 🟢</span>`;
            feed.insertBefore(newPost, feed.firstChild);
            postTextArea.value = "";
        }
    </script>
</body>
</html>
