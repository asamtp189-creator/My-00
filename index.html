<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialNode</title>
    <script src="https://pubnub.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #111b21; }
        .container { width: 100%; max-width: 450px; height: 100vh; display: flex; flex-direction: column; background-color: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.1); position: relative; }
        .login-box { padding: 30px; text-align: center; margin: auto; width: 80%; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 5px solid #00a884; }
        .login-box h1 { color: #00a884; font-size: 2em; margin-top: 0; font-weight: bold; }
        .input-group { margin-bottom: 15px; text-align: right; direction: rtl; }
        label { display: block; margin-bottom: 6px; color: #667781; font-size: 0.95em; }
        input { width: 100%; padding: 12px; border: 1px solid #e9edef; background-color: #fff; color: #000; border-radius: 8px; box-sizing: border-box; font-size: 1em; }
        input:focus { outline: none; border-color: #00a884; }
        .btn { width: 100%; padding: 12px; border: none; background-color: #00a884; color: #fff; font-weight: bold; font-size: 1.1em; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: 0.2s; }
        .sub-btn { background-color: transparent; color: #00a884; border: 1px solid #00a884; margin-top: 15px; font-size: 0.95em; box-shadow: none; }
        .error-msg { color: #ff4444; font-size: 0.85em; margin-top: 5px; display: none; text-align: right; }
        #lobbyScreen { display: none; width: 100%; height: 100%; flex-direction: column; background-color: #f0f2f5; }
        .lobby-header { background-color: #00a884; color: white; padding: 20px; text-align: right; direction: rtl; font-size: 1.3em; font-weight: bold; }
        .search-area { padding: 30px 20px; text-align: right; direction: rtl; background: #fff; margin-top: 15px; border-radius: 8px; width: 90%; margin-left: auto; margin-right: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #chatScreen { display: none; width: 100%; height: 100%; flex-direction: column; background-color: #efeae2; }
        .chat-header { background-color: #00a884; color: white; padding: 15px; text-align: right; direction: rtl; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { margin: 0; font-size: 1.2em; color: #fff; }
        .back-btn { width: auto; padding: 6px 15px; font-size: 0.9em; background-color: #ff4444; color: white; margin: 0; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; background-image: url('https://githubusercontent.com'); background-repeat: repeat; }
        .msg { margin-bottom: 8px; padding: 10px 14px; border-radius: 10px; max-width: 75%; word-wrap: break-word; text-align: right; direction: rtl; font-size: 0.95em; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.me { background-color: #d9fdd3; color: #111b21; align-self: flex-end; }
        .msg.other { background-color: #ffffff; color: #111b21; align-self: flex-start; }
        .chat-input-area { padding: 12px; background-color: #f0f2f5; display: flex; gap: 8px; align-items: center; }
        .chat-input-area input { flex: 1; border-radius: 20px; padding: 12px 15px; border: none; background-color: #fff; color: #000; }
        .send-btn { width: auto; padding: 10px 22px; border-radius: 20px; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 🔐 المرحلة 1 -->
        <div id="loginScreen" class="login-box">
            <h1>SocialNode</h1>
            <div class="input-group">
                <label>البريد الإلكتروني الحقيقي (لاستلام الكود):</label>
                <input type="email" id="emailInput" required placeholder="example@mail.com">
            </div>
            <div class="input-group">
                <label>كلمة المرور:</label>
                <input type="password" id="passwordInput" required placeholder="اكتب كلمة المرور">
            </div>
            <div class="input-group">
                <label>اسم المستخدم الفريد (Username):</label>
                <input type="text" id="usernameInput" required placeholder="مثال: osamah_node" autocomplete="off">
            </div>
            <button type="button" class="btn" onclick="goToOTPScreen()">إرسال رمز التأكيد</button>
        </div>

        <!-- 🔑 المرحلة 2 -->
        <div id="otpScreen" class="login-box" style="display: none;">
            <h1>تحقق الحساب</h1>
            <p style="color: #667781; font-size: 0.95em;">يرجى طلب رمز التأكيد وتفقد بريدك الإلكتروني.</p>
            <div class="input-group">
                <label>أدخل رمز التأكيد المتكون من 4 أرقام:</label>
                <input type="text" id="otpInput" maxlength="4" required placeholder="0000" style="text-align: center; letter-spacing: 8px; font-size: 1.4em; font-weight: bold;">
                <div id="otpError" class="error-msg">❌ رمز التأكيد غير صحيح!</div>
            </div>
            <button type="button" class="btn" onclick="verifyOTP()">تأكيد ودخول الشبكة</button>
            <button type="button" class="btn sub-btn" id="sendOtpBtn" onclick="generateAndSendRealEmail()">اضغط هنا لإرسال الكود لبريدك 📧</button>
        </div>

        <!-- 🔍 المرحلة 3 -->
        <div id="lobbyScreen">
            <div class="lobby-header">SocialNode - محادثة جديدة</div>
            <div class="search-area">
                <label style="font-weight: bold; display: block; margin-bottom: 10px; color: #00a884;">بدء محادثة مع صديق:</label>
                <input type="text" id="targetInput" placeholder="اكتب اسم مستخدم صديقك بدقة..">
                <button class="btn" style="margin-top: 20px;" onclick="startPrivateChat()">💬 بدء المحادثة حياً</button>
            </div>
        </div>

        <!-- 💬 المرحلة 4 -->
        <div id="chatScreen">
            <div class="chat-header">
                <button class="btn back-btn" onclick="backToLobby()">خروج</button>
                <div><h2 id="chatWithTitle">اسم الصديق</h2></div>
            </div>
            <div class="chat-messages" id="messageBox"></div>
            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="اكتب رسالة..." autocomplete="off">
                <button class="btn send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>
    <script>
        // تفعيل الربط السحابي الحقيقي بمفاتيح حسابك
        const PUBLIC_KEY = "Cj39Bcxpc2GChL_nc";   
        const SERVICE_ID = "service_l2u8d97";      
        const TEMPLATE_ID = "YOUR_TEMPLATE_ID_HERE"; // 📌 امسح هذه الكلمة واكتب كود الـ Template ID الخاص بك هنا

        emailjs.init(PUBLIC_KEY); 

        let myUsername = "";
        let targetUser = "";
        let generatedOTP = "";
        let userEmailAddress = "";

        function goToOTPScreen() {
            myUsername = document.getElementById('usernameInput').value.trim().toLowerCase();
            userEmailAddress = document.getElementById('emailInput').value.trim();
            if (userEmailAddress === "" || myUsername === "") { alert("الرجاء تعبئة الحقول!"); return; }
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('otpScreen').style.display = 'block';
        }

        function generateAndSendRealEmail() {
            let btn = document.getElementById('sendOtpBtn');
            btn.innerHTML = "جاري إرسال الكود لبريدك... ⏳";
            btn.disabled = true;

            generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();

            let templateParams = {
                email: userEmailAddress,
                to_email: userEmailAddress,
                otp_code: generatedOTP
            };

            emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
                .then(function() {
                    alert("✅ نجاح حقيقي! تفقد صندوق الوارد (Inbox) في تطبيق الجيميل الآن وسيتوقف التنبيه المنبثق للأبد!");
                    btn.innerHTML = "تم إرسال الكود بنجاح 🟢";
                }, function(error) {
                    alert("🔓 [الكود الاحتياطي]: الكود هو: " + generatedOTP + " (تأكد من كتابة كود الـ Template ID الصحيح في السطر 7 داخل جيتهاب ليعمل الإرسال للبريد)");
                    btn.innerHTML = "إعادة طلب الكود 📧";
                    btn.disabled = false;
                });
        }

        function verifyOTP() {
            let userOTP = document.getElementById('otpInput').value.trim();
            if (generatedOTP !== "" && userOTP === generatedOTP) {
                document.getElementById('otpScreen').style.display = 'none';
                document.getElementById('lobbyScreen').style.display = 'flex';
            } else { document.getElementById('otpError').style.display = 'block'; }
        }

        function startPrivateChat() {
            targetUser = document.getElementById('targetInput').value.trim().toLowerCase();
            if (targetUser === "" || targetUser === myUsername) { alert("اسم غير صحيح!"); return; }
            document.getElementById('chatWithTitle').innerHTML = targetUser;
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';
            document.getElementById('messageBox').innerHTML = ""; 
            displayMessage(targetUser, "مرحباً بك في شبكة SocialNode!");
        }

        function sendMessage() {
            let input = document.getElementById('msgInput');
            let text = input.value.trim();
            if (text === "") return;
            displayMessage(myUsername, text);
            input.value = "";
            setTimeout(() => { displayMessage(targetUser, "وصلتني رسالتك الآمنة: (" + text + ") 👍"); }, 1500);
        }

        function displayMessage(user, text) {
            let box = document.getElementById('messageBox');
            let isMe = (user === myUsername);
            let msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isMe ? 'me' : 'other'}`;
            msgDiv.innerHTML = text;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight; 
        }

        function backToLobby() {
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById('lobbyScreen').style.display = 'flex';
        }
    </script>
</body>
</html>
