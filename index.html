<!DOCTYPE html>
<html>
<head>
    <title>Osamah Secure Login</title>
    <style>
        body { background-color: #0c0c0c; color: #00ff00; font-family: monospace; text-align: center; padding-top: 50px; }
        h1 { font-size: 2.2em; text-shadow: 0 0 15px #00ff00; margin-bottom: 20px; }
        .login-box { border: 2px solid #00ff00; padding: 40px 30px; display: inline-block; border-radius: 10px; box-shadow: 0 0 25px rgba(0,255,0,0.4); background-color: #111; width: 300px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #00ff00; font-size: 1.1em; }
        input[type="email"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #00ff00; background-color: #000; color: #fff; border-radius: 5px; box-sizing: border-box; font-family: monospace; }
        input:focus { outline: none; box-shadow: 0 0 8px #00ff00; }
        .btn { width: 100%; padding: 12px; border: none; background-color: #00ff00; color: #000; font-weight: bold; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-family: monospace; box-shadow: 0 0 10px #00ff00; }
        .btn:hover { background-color: #00cc00; box-shadow: 0 0 15px #00cc00; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Osamah Secure Portal</h1>
        <form onsubmit="alert('تم إرسال البيانات بنجاح في المختبر!'); return false;">
            <div class="input-group">
                <label>Email Address:</label>
                <input type="email" placeholder="enter your email" required>
            </div>
            <div class="input-group">
                <label>Password:</label>
                <input type="password" placeholder="enter your password" required>
            </div>
            <button type="submit" class="btn">LOGIN</button>
        </form>
    </div>
</body>
</html>
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osamah Cyber Security Lab</title>
    <style>
        body { background-color: #0c0c0c; color: #00ff00; font-family: monospace; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 2.2em; text-shadow: 0 0 15px #00ff00; }
        
        /* تصميم الصناديق */
        .section-box { border: 2px solid #00ff00; padding: 20px; margin-bottom: 25px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,255,0,0.2); background-color: #111; text-align: right; direction: rtl; }
        h2 { color: #fff; font-size: 1.4em; border-bottom: 1px solid #00ff00; padding-bottom: 5px; }
        
        /* المدخلات والأزرار */
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #00ff00; background-color: #000; color: #fff; border-radius: 5px; box-sizing: border-box; font-family: monospace; margin-top: 10px; margin-bottom: 10px; }
        input:focus, textarea:focus { outline: none; box-shadow: 0 0 8px #00ff00; }
        .btn { padding: 10px 20px; border: none; background-color: #00ff00; color: #000; font-weight: bold; border-radius: 5px; cursor: pointer; font-family: monospace; box-shadow: 0 0 8px #00ff00; }
        .btn:hover { background-color: #00cc00; }

        /* نتائج البحث والمنشورات */
        .result-item, .post-item { background-color: #000; padding: 12px; border-right: 4px solid #00ff00; margin-top: 10px; border-radius: 3px; color: #fff; }
        .post-time { font-size: 0.8em; color: #00ff00; display: block; margin-top: 5px; }
        .no-results { color: #ff3333; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Osamah Cyber Security Lab 🚀</h1>
        <p style="color: #fff;">مختبر أسامة التقني الحي - ابحث وانشر تحديثاتك</p>

        <!-- الجزء الأول: محرك البحث عن المعلومات -->
        <div class="section-box">
            <h2>🔍 البحث عن نصائح برمجية وأمنية</h2>
            <input type="text" id="searchInput" onkeyup="searchInfo()" placeholder="اكتب للبحث... (جرّب كتابة: كلمة سر، واي فاي، بايثون)">
            <div id="searchResponse"></div>
        </div>

        <!-- الجزء الثاني: لوحة التواصل الاجتماعي المصغرة -->
        <div class="section-box">
            <h2>💬 انشر تحديثاً حياً في المعمل</h2>
            <textarea id="postText" rows="3" placeholder="ماذا تتعلم اليوم؟ اكتب تحديثك هنا..."></textarea>
            <button class="btn" onclick="addPost()">نـشـر التحديث</button>
            
            <div id="liveFeed">
                <!-- المنشورات الافتراضية المجهزة مسبقاً -->
                <div class="post-item">
                    <strong>المهندس أسامة:</strong> تم إطلاق المختبر الحقيقي بنجاح 100%!
                    <span class="post-time">منذ قليل</span>
                </div>
            </div>
        </div>
    </div>

    <!-- كود التشغيل الحي الذكي (JavaScript) -->
    <script>
        // قاعدة البيانات المصغرة لمحرك البحث
        const database = [
            { key: "كلمة سر", val: "💡 نصيحة أمنية: لتأمين حسابك، اجعل كلمة السر لا تقل عن 12 خانة وتحتوي على رموز مثل @ و # وأرقام." },
            { key: "واي فاي", val: "🛡️ حماية الشبكات: قم بإخفاء اسم شبكة الواي فاي المنزلية (SSID) وعطل خاصية WPS لحمايتها من التخمين." },
            { key: "بايثون", val: "🐍 لغة بايثون: هي اللغة المفضلة لمحترفي الأمن السيبراني بسبب سهولة كتابتها ووفرة مكتباتها البرمجية." },
            { key: "لينكس", val: "🖥️ نظام لينكس: نظام تشغيل مفتوح المصدر يعتمد عليه كافة خبراء الحماية والخوادم حول العالم." }
        ];

        // وظيفة البحث الفوري الحي
        function searchInfo() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let responseDiv = document.getElementById('searchResponse');
            responseDiv.innerHTML = "";
            
            if (input.trim() === "") return;

            let found = database.filter(item => item.key.includes(input));

            if (found.length > 0) {
                found.forEach(item => {
                    responseDiv.innerHTML += `<div class="result-item">${item.val}</div>`;
                });
            } else {
                responseDiv.innerHTML = `<div class="result-item no-results">❌ لم يتم العثور على معلومات حول هذه الكلمة في المعمل حالياً.</div>`;
            }
        }

        // وظيفة نشر منشور جديد تلقائياً في الصفحة
        function addPost() {
            let postTextArea = document.getElementById('postText');
            let postContent = postTextArea.value.trim();
            
            if (postContent === "") {
                alert("الرجاء كتابة نص أولاً قبل النشر!");
                return;
            }

            let feed = document.getElementById('liveFeed');
            
            // بناء عنصر المنشور الجديد
            let newPost = document.createElement('div');
            newPost.className = 'post-item';
            newPost.innerHTML = `
                <strong>زائر مجهول:</strong> ${postContent}
                <span class="post-time">الآن 🟢</span>
            `;
            
            // إضافة المنشور في أعلى لوحة التحديثات
            feed.insertBefore(newPost, feed.firstChild);
            
            // تفريغ صندوق الكتابة بعد النشر
            postTextArea.value = "";
        }
    </script>
</body>
</html>
